version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_copilot_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_copilot
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

